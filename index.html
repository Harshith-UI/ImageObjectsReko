<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Image Recognition</title>

  <!-- Google Analytics (GA4) Tracking Code -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QQCGTB8LHF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QQCGTB8LHF');
  </script>

</head>
<body>
  <div class="container">
    <h1>🖼️ AI-Powered Image Recognition</h1>
    <div class="card">
      <input type="file" id="fileInput" accept="image/*">
      <button id="uploadBtn">Upload Image</button>
      <div id="uploadedImageContainer">
        <img id="uploadedImage" alt="Uploaded image preview will appear here." />
      </div>
      <div id="responseContainer">
        <p class="responseTitle">Detected Objects:</p>
        <ul id="responseData"></ul>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
